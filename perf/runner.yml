name: Measure FFF core

on:
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [pr, reference, calibrate]
        required: true
      harness_sha:
        type: string
        required: true
      base_sha:
        type: string
      head_sha:
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    if: inputs.kind == 'pr' || inputs.kind == 'calibrate'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      matrix:
        variant: ${{ fromJSON(inputs.kind == 'pr' && '["base","head"]' || '["base"]') }}
    steps:
      - name: Fetch source and trusted build script
        env:
          HARNESS: ${{ inputs.harness_sha }}
          BASE: ${{ inputs.base_sha }}
          REVISION: ${{ matrix.variant == 'base' && inputs.base_sha || inputs.head_sha }}
        run: |
          [[ "$HARNESS" =~ ^[0-9a-f]{40}$ && "$BASE" =~ ^[0-9a-f]{40}$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          repo=https://github.com/dmtrKovalenko/fff.git
          git init -q source
          git -C source fetch -q --depth=1 "$repo" "$HARNESS" "$BASE" "$REVISION"
          git -C source show "$HARNESS:perf/build.sh" > "$RUNNER_TEMP/build.sh"
          git -C source -c core.hooksPath=/dev/null checkout -q --detach "$REVISION"
          git -C source -c core.hooksPath=/dev/null checkout "$BASE" -- crates/fff-core/benches
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
          use-cache: false
      - name: Install Rust build tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target x86_64-unknown-linux-musl
          cargo +1.99.1 install cargo-zigbuild --version 0.24.1 --locked
      - name: Build the FFF core benchmarks
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
        run: |
          token=$(cat /proc/sys/kernel/random/uuid)
          printf '::stop-commands::%s\n' "$token"
          trap 'printf "::%s::\n" "$token"' EXIT
          bash "$RUNNER_TEMP/build.sh" source "$RUNNER_TEMP/fff-build"
      - name: Upload benchmark binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fff-bench-${{ matrix.variant }}
          path: ${{ runner.temp }}/fff-build/bins
          if-no-files-found: error
          retention-days: 2

  measure:
    needs: build
    if: ${{ !cancelled() && (inputs.kind == 'reference' || needs.build.result == 'success') }}
    runs-on: [self-hosted, linux, x64, fff-perf-load]
    timeout-minutes: 45
    concurrency:
      group: fff-perf-load
      queue: max
    steps:
      - name: Fetch trusted measurement script
        env:
          HARNESS: ${{ inputs.harness_sha }}
        run: |
          [[ "$HARNESS" =~ ^[0-9a-f]{40}$ ]]
          repo=$(mktemp -d)
          trap 'rm -rf -- "$repo"' EXIT
          git init -q "$repo"
          git -C "$repo" fetch -q --depth=1 https://github.com/dmtrKovalenko/fff.git "$HARNESS"
          git -C "$repo" show "$HARNESS:perf/benchmark.sh" > "$RUNNER_TEMP/benchmark.sh"
      - name: Download benchmark binaries
        if: inputs.kind != 'reference'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: fff-bench-*
          path: ${{ runner.temp }}/fff-binaries
      - name: Measure on load
        env:
          KIND: ${{ inputs.kind }}
          BASE: ${{ inputs.base_sha }}
        run: |
          token=$(cat /proc/sys/kernel/random/uuid)
          printf '::stop-commands::%s\n' "$token"
          trap 'printf "::%s::\n" "$token"' EXIT
          script="$RUNNER_TEMP/benchmark.sh"
          binaries="$RUNNER_TEMP/fff-binaries"
          output="$RUNNER_TEMP/fff-results"
          case "$KIND" in
            pr) bash "$script" compare "$output" "$binaries/fff-bench-base" "$binaries/fff-bench-head" ;;
            calibrate) bash "$script" calibrate "$output" "$binaries/fff-bench-base" "$BASE" ;;
            reference) bash "$script" reference "$output" ;;
            *) exit 1 ;;
          esac
      - name: Upload measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fff-measurements
          path: ${{ runner.temp }}/fff-results/*.bench
          if-no-files-found: error
          retention-days: 14
