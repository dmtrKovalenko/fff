[target.'cfg(target_os = "macos")']
rustflags = [
  "-C", "link-arg=-undefined",
  "-C", "link-arg=dynamic_lookup",
  # rust-objcopy (rustc strip) before LLVM 22.1.8 leaves the LINKEDIT string
  # pool 4-byte aligned, which macOS 27 dyld rejects; let ld strip instead.
  "-C", "strip=none",
  "-C", "link-arg=-Wl,-x",
  "-C", "link-arg=-Wl,-S",
]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

# Android/Termux: no hardcoded linker so native Termux builds use the system cc.
# For CI cross-compilation the linker is set via CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER env var.
[target.aarch64-linux-android]
rustflags = ["-C", "link-args=-rdynamic"]
