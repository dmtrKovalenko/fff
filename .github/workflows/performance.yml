name: FFF performance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: fff-performance
  queue: max

permissions: {}

defaults:
  run:
    shell: bash

env:
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  plan:
    if: >-
      github.repository == 'dmtrKovalenko/fff' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || github.event.label.name == 'perf-check')))
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
      statuses: write
    outputs:
      kind: ${{ steps.resolve.outputs.kind }}
      number: ${{ steps.resolve.outputs.number }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve the benchmark revision
        id: resolve
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE: ${{ contains(github.event.pull_request.labels.*.name, 'perf-check') }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            printf 'kind=calibrate\nbase_sha=5d21e4bbdf33a09f58975636208e30747bc8d918\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          actual=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq 'select(.state == "open" and .base.ref == "main") | .head.sha')
          [[ "$actual" == "$HEAD_SHA" ]] || exit 0
          kind=pr
          if [[ "$FORCE" != true ]]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[] | .filename, .previous_filename // empty')
            if ! grep -E '^(Cargo\.(toml|lock)|\.cargo/config\.toml|crates/fff-(core|grep|query-parser)/(Cargo\.toml|.*\.rs))$' \
              <<<"$files" >/dev/null; then
              kind=skip
            fi
          fi
          printf 'kind=%s\nnumber=%s\nbase_sha=%s\nhead_sha=%s\n' \
            "$kind" "$PR_NUMBER" "$BASE_SHA" "$HEAD_SHA" >>"$GITHUB_OUTPUT"
      - name: Mark the PR check pending
        if: >-
          steps.resolve.outputs.kind == 'pr' &&
          github.event.pull_request.head.repo.id == github.event.repository.id &&
          github.actor != 'dependabot[bot]'
        env:
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f context='FFF performance' \
            -f state=pending -f description='Queued for measurement on load' -f target_url="$RUN_URL" >/dev/null

  build:
    needs: plan
    if: needs.plan.outputs.kind == 'pr' || needs.plan.outputs.kind == 'calibrate'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.kind == 'pr' && '["base","head"]' || '["base"]') }}
    steps:
      - name: Fetch source and benchmark harness
        env:
          HARNESS: ${{ github.sha }}
          BASE: ${{ needs.plan.outputs.base_sha }}
          REVISION: ${{ matrix.variant == 'base' && needs.plan.outputs.base_sha || needs.plan.outputs.head_sha }}
        run: |
          [[ "$HARNESS" =~ ^[0-9a-f]{40}$ && "$BASE" =~ ^[0-9a-f]{40}$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          repo=https://github.com/dmtrKovalenko/fff.git
          git init -q source
          git -C source fetch -q --depth=1 "$repo" "$HARNESS" "$BASE" "$REVISION"
          git -C source show "$HARNESS:perf/build.sh" > "$RUNNER_TEMP/build.sh"
          git -C source -c core.hooksPath=/dev/null checkout -q --detach "$REVISION"
          git -C source -c core.hooksPath=/dev/null checkout "$HARNESS" -- crates/fff-core/benches
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
          use-cache: false
      - name: Install Rust build tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target x86_64-unknown-linux-musl
          cargo +1.99.1 install cargo-zigbuild --version 0.24.1 --locked
      - name: Build the FFF core benchmarks
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
        run: |
          token=$(cat /proc/sys/kernel/random/uuid)
          printf '::stop-commands::%s\n' "$token"
          trap 'printf "::%s::\n" "$token"' EXIT
          bash "$RUNNER_TEMP/build.sh" source "$RUNNER_TEMP/fff-build"
      - name: Upload benchmark binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fff-bench-${{ matrix.variant }}
          path: ${{ runner.temp }}/fff-build/bins
          if-no-files-found: error
          retention-days: 2
          overwrite: true

  measure:
    needs: [plan, build]
    runs-on: [self-hosted, linux, x64, fff-perf-load]
    timeout-minutes: 45
    steps:
      - name: Fetch measurement script
        env:
          HARNESS: ${{ github.sha }}
        run: |
          [[ "$HARNESS" =~ ^[0-9a-f]{40}$ ]]
          repo=$(mktemp -d)
          trap 'rm -rf -- "$repo"' EXIT
          git init -q "$repo"
          git -C "$repo" fetch -q --depth=1 https://github.com/dmtrKovalenko/fff.git "$HARNESS"
          git -C "$repo" show "$HARNESS:perf/benchmark.sh" > "$RUNNER_TEMP/benchmark.sh"
      - name: Download benchmark binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: fff-bench-*
          path: ${{ runner.temp }}/fff-binaries
      - name: Measure on load
        env:
          KIND: ${{ needs.plan.outputs.kind }}
          BASE: ${{ needs.plan.outputs.base_sha }}
        run: |
          token=$(cat /proc/sys/kernel/random/uuid)
          printf '::stop-commands::%s\n' "$token"
          trap 'printf "::%s::\n" "$token"' EXIT
          script="$RUNNER_TEMP/benchmark.sh"
          binaries="$RUNNER_TEMP/fff-binaries"
          output="$RUNNER_TEMP/fff-results"
          case "$KIND" in
            pr) bash "$script" compare "$output" "$binaries/fff-bench-base" "$binaries/fff-bench-head" ;;
            calibrate) bash "$script" calibrate "$output" "$binaries/fff-bench-base" "$BASE" ;;
            *) exit 1 ;;
          esac
      - name: Upload measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fff-measurements
          path: ${{ runner.temp }}/fff-results/*.bench
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  report:
    needs: [plan, measure]
    if: "!cancelled() && (needs.plan.outputs.kind == 'pr' || needs.plan.outputs.kind == 'skip')"
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      ready: ${{ steps.upload.outcome == 'success' }}
    steps:
      - name: Verify the PR revision is current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.plan.outputs.number }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
        run: |
          actual=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq 'select(.state == "open" and .base.ref == "main") | .head.sha')
          if [[ "$actual" == "$HEAD_SHA" ]]; then
            echo 'match=true' >>"$GITHUB_OUTPUT"
          fi
      - name: Download measured timings
        id: timings
        if: needs.measure.result == 'success' && steps.current.outputs.match == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: fff-measurements
          path: ${{ runner.temp }}/fff-perf
      - name: Restore the chart renderer build
        if: steps.timings.outcome == 'success'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ${{ runner.temp }}/harness/perf/chart/target
          key: fff-perf-chart-${{ github.sha }}
          restore-keys: fff-perf-chart-
      - name: Render the timing chart
        if: steps.timings.outcome == 'success'
        continue-on-error: true
        run: |
          PERF_DIR="$RUNNER_TEMP/fff-perf"
          repo="$RUNNER_TEMP/harness" chart="$RUNNER_TEMP/fff-chart.png"
          git init -q "$repo"
          git -C "$repo" fetch -q --depth=1 https://github.com/dmtrKovalenko/fff.git "$GITHUB_SHA"
          git -C "$repo" -c core.hooksPath=/dev/null checkout -q FETCH_HEAD -- perf/chart
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 run --release --locked --manifest-path "$repo/perf/chart/Cargo.toml" --example chart -- \
            "$PERF_DIR/base.bench" "$PERF_DIR/head.bench" "$chart"
          mv "$chart" "$PERF_DIR/chart.png"
      - name: Record the compared revision
        if: "!cancelled() && steps.current.outputs.match == 'true'"
        env:
          KIND: ${{ needs.plan.outputs.kind }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: |
          PERF_DIR="$RUNNER_TEMP/fff-perf"
          mkdir -p "$PERF_DIR"
          printf '%s\n' "$KIND" >"$PERF_DIR/kind"
          printf '%s\n' "$BASE_SHA" >"$PERF_DIR/base-sha"
      - name: Upload the PR report
        id: upload
        if: "!cancelled() && steps.current.outputs.match == 'true'"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fff-performance-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fff-perf
          if-no-files-found: error
          retention-days: 30
      - name: Check fork timings
        if: >-
          steps.timings.outcome == 'success' &&
          (github.event.pull_request.head.repo.id != github.event.repository.id || github.actor == 'dependabot[bot]')
        run: |
          PERF_DIR="$RUNNER_TEMP/fff-perf"
          script="$RUNNER_TEMP/report.sh"
          curl -fsSL "https://raw.githubusercontent.com/dmtrKovalenko/fff/$GITHUB_SHA/perf/report.sh" -o "$script"
          bash "$script" "$PERF_DIR/base.bench" "$PERF_DIR/head.bench" >>"$GITHUB_STEP_SUMMARY"

  publish:
    needs: report
    if: >-
      !cancelled() && needs.report.outputs.ready == 'true' &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.actor != 'dependabot[bot]'
    permissions:
      actions: read
      contents: write
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/performance-publish.yml
