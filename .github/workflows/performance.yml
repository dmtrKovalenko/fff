name: FFF performance

on:
  workflow_run:
    workflows: [Spelling]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: fff-performance
  queue: max

permissions: {}

defaults:
  run:
    shell: bash

env:
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  plan:
    if: >-
      github.repository == 'dmtrKovalenko/fff' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.path == '.github/workflows/spelling.yaml' &&
        (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pull-requests: read
      statuses: write
    outputs:
      kind: ${{ steps.resolve.outputs.kind }}
      number: ${{ steps.resolve.outputs.number }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve the PR revision that ran CI
        id: resolve
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          SOURCE_REPO_ID: ${{ github.event.workflow_run.head_repository.id }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            printf 'kind=calibrate\nbase_sha=5d21e4bbdf33a09f58975636208e30747bc8d918\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [[ -n "$SOURCE_OWNER" && "$SOURCE_REPO_ID" =~ ^[0-9]+$ && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 0
          started=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/attempts/$CI_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.runner_id > 0 and .started_at != null) | .id')
          [[ -n "$started" ]] || exit 0
          pr=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f base=main -f head="$SOURCE_OWNER:$SOURCE_BRANCH" |
            jq -r --argjson repo "$SOURCE_REPO_ID" --arg sha "$SOURCE_SHA" '
              .[] | select(.head.repo.id == $repo and .head.sha == $sha) |
              "kind=pr\nnumber=\(.number)\nbase_sha=\(.base.sha)\nhead_sha=\(.head.sha)"
            ')
          [[ "$pr" =~ number=([0-9]+) ]] || exit 0
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${BASH_REMATCH[1]}/files" \
            --jq '.[] | .filename, .previous_filename // empty')
          # Only core Rust sources and Rust dependency changes are measured.
          if grep -E '^(Cargo\.(toml|lock)|\.cargo/config\.toml|crates/fff-(core|grep|query-parser)/(Cargo\.toml|.*\.rs))$' \
            <<<"$files" >/dev/null; then
            printf '%s\n' "$pr" >>"$GITHUB_OUTPUT"
          else
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" -f context='FFF performance' -f state=success \
              -f description='Skipped, no core Rust or dependency changes' -f target_url="$RUN_URL" >/dev/null
          fi
      - name: Mark the PR check pending
        if: steps.resolve.outputs.kind == 'pr'
        env:
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f context='FFF performance' \
            -f state=pending -f description='Queued for measurement on load' -f target_url="$RUN_URL" >/dev/null

  build:
    needs: plan
    if: needs.plan.outputs.kind == 'pr' || needs.plan.outputs.kind == 'calibrate'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.kind == 'pr' && '["base","head"]' || '["base"]') }}
    steps:
      - name: Fetch source and trusted build script
        env:
          HARNESS: ${{ github.sha }}
          BASE: ${{ needs.plan.outputs.base_sha }}
          REVISION: ${{ matrix.variant == 'base' && needs.plan.outputs.base_sha || needs.plan.outputs.head_sha }}
        run: |
          [[ "$HARNESS" =~ ^[0-9a-f]{40}$ && "$BASE" =~ ^[0-9a-f]{40}$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          repo=https://github.com/dmtrKovalenko/fff.git
          git init -q source
          git -C source fetch -q --depth=1 "$repo" "$HARNESS" "$BASE" "$REVISION"
          git -C source show "$HARNESS:perf/build.sh" > "$RUNNER_TEMP/build.sh"
          git -C source -c core.hooksPath=/dev/null checkout -q --detach "$REVISION"
          git -C source -c core.hooksPath=/dev/null checkout "$HARNESS" -- crates/fff-core/benches
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
          use-cache: false
      - name: Install Rust build tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target x86_64-unknown-linux-musl
          cargo +1.99.1 install cargo-zigbuild --version 0.24.1 --locked
      - name: Build the FFF core benchmarks
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
        run: |
          token=$(cat /proc/sys/kernel/random/uuid)
          printf '::stop-commands::%s\n' "$token"
          trap 'printf "::%s::\n" "$token"' EXIT
          bash "$RUNNER_TEMP/build.sh" source "$RUNNER_TEMP/fff-build"
      - name: Upload benchmark binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fff-bench-${{ matrix.variant }}
          path: ${{ runner.temp }}/fff-build/bins
          if-no-files-found: error
          retention-days: 2

  measure:
    needs: [plan, build]
    runs-on: [self-hosted, linux, x64, fff-perf-load]
    timeout-minutes: 45
    steps:
      - name: Fetch trusted measurement script
        env:
          HARNESS: ${{ github.sha }}
        run: |
          [[ "$HARNESS" =~ ^[0-9a-f]{40}$ ]]
          repo=$(mktemp -d)
          trap 'rm -rf -- "$repo"' EXIT
          git init -q "$repo"
          git -C "$repo" fetch -q --depth=1 https://github.com/dmtrKovalenko/fff.git "$HARNESS"
          git -C "$repo" show "$HARNESS:perf/benchmark.sh" > "$RUNNER_TEMP/benchmark.sh"
      - name: Download benchmark binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: fff-bench-*
          path: ${{ runner.temp }}/fff-binaries
      - name: Measure on load
        env:
          KIND: ${{ needs.plan.outputs.kind }}
          BASE: ${{ needs.plan.outputs.base_sha }}
        run: |
          token=$(cat /proc/sys/kernel/random/uuid)
          printf '::stop-commands::%s\n' "$token"
          trap 'printf "::%s::\n" "$token"' EXIT
          script="$RUNNER_TEMP/benchmark.sh"
          binaries="$RUNNER_TEMP/fff-binaries"
          output="$RUNNER_TEMP/fff-results"
          case "$KIND" in
            pr) bash "$script" compare "$output" "$binaries/fff-bench-base" "$binaries/fff-bench-head" ;;
            calibrate) bash "$script" calibrate "$output" "$binaries/fff-bench-base" "$BASE" ;;
            *) exit 1 ;;
          esac
      - name: Upload measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fff-measurements
          path: ${{ runner.temp }}/fff-results/*.bench
          if-no-files-found: error
          retention-days: 30

  report:
    needs: [plan, measure]
    if: ${{ !cancelled() && needs.plan.outputs.kind == 'pr' }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify the PR revision is current
        id: current
        env:
          PR_NUMBER: ${{ needs.plan.outputs.number }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
        run: |
          actual=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq 'select(.state == "open" and .base.ref == "main") | .head.sha')
          if [[ "$actual" == "$HEAD_SHA" ]]; then
            echo 'match=true' >>"$GITHUB_OUTPUT"
          fi
      - name: Download measured timings
        id: timings
        if: needs.measure.result == 'success' && steps.current.outputs.match == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: fff-measurements
          path: ${{ runner.temp }}/fff-perf
      - name: Publish timings
        if: always() && steps.current.outputs.match == 'true'
        env:
          PR_NUMBER: ${{ needs.plan.outputs.number }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          MEASURE: ${{ steps.timings.outcome }}
          PERF_DIR: ${{ runner.temp }}/fff-perf
        run: |
          report="$RUNNER_TEMP/fff-timings.md"
          state=error
          if [[ "$MEASURE" == success ]]; then
            script="$RUNNER_TEMP/report.sh" code=0
            curl -fsSL "https://raw.githubusercontent.com/dmtrKovalenko/fff/$GITHUB_SHA/perf/report.sh" -o "$script" &&
              bash "$script" "$PERF_DIR/base.bench" "$PERF_DIR/head.bench" >"$report" || code=$?
            case "$code" in
              0) state=success ;;
              1) state=failure ;;
              *) echo 'FFF core measurement could not complete.' >"$report" ;;
            esac
          else
            echo 'FFF core measurement could not complete.' >"$report"
          fi
          case "$state" in
            success) icon=✅ message='FFF core performance passed' ;;
            failure) icon=🔴 message='FFF core performance comparison failed' ;;
            error) icon=⚠️ message='FFF core measurement could not complete' ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f context='FFF performance' \
            -f state="$state" -f description="$message" -f target_url="$RUN_URL" >/dev/null
          if [[ "$MEASURE" == success ]]; then
            marker='<!-- fff-core-performance -->'
            comment="$RUNNER_TEMP/fff-pr-comment.md"
            {
              printf '%s\n## 🥼 FFF core performance\n\n%s **%s**\n\n' "$marker" "$icon" "$message"
              printf 'Base %s · PR %s\n\n' "$BASE_SHA" "$HEAD_SHA"
              cat "$report"
              printf '\n🔗 [Workflow run](%s)\n' "$RUN_URL"
            } >"$comment"
            comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- fff-core-performance -->"))) | .id' |
              tail -n 1)
            if [[ -n "$comment_id" ]]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
                --field "body=@$comment" >/dev/null
            else
              gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --body-file "$comment"
            fi
          fi
          cat "$report" >>"$GITHUB_STEP_SUMMARY"
          [[ "$state" == success ]]
