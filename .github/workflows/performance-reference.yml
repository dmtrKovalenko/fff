name: FFF performance reference

on:
  schedule:
    - cron: '7 4 * * *'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  reference:
    if: github.repository == 'dmtrKovalenko/fff' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, fff-perf-load]
    timeout-minutes: 45
    permissions:
      issues: write
    steps:
      - name: Measure the saved reference
        id: timings
        run: |
          script="$RUNNER_TEMP/benchmark.sh"
          curl -fsSL "https://raw.githubusercontent.com/dmtrKovalenko/fff/$GITHUB_SHA/perf/benchmark.sh" -o "$script"
          bash "$script" reference "$RUNNER_TEMP/fff-results"
      - name: Publish reference result
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          MEASURE: ${{ steps.timings.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$RUNNER_TEMP/fff-reference.md"
          if [[ "$MEASURE" == success ]]; then
            results="$RUNNER_TEMP/fff-results"
            if awk '
              NR == FNR { base[$2] = $5; next }
              10 * $5 > 11 * base[$2] || 10 * $5 < 9 * base[$2] {
                if (!rows++) print "| Benchmark | Baseline (ns) | Measured (ns) | Change |\n| --- | ---: | ---: | ---: |"
                printf "| `%s` | %d | %d | %+.2f%% |\n", $2, base[$2], $5, 100 * ($5 / base[$2] - 1)
              }
              END { exit (rows > 0) }
            ' "$results/base.bench" "$results/head.bench" >"$report"; then
              echo 'FFF core reference is within 10%' >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            echo 'FFF core measurement could not complete.' >"$report"
          fi
          title='FFF benchmark reference drift'
          printf '\n[Workflow run](%s)\n' "$RUN_URL" >>"$report"
          cat "$report" >>"$GITHUB_STEP_SUMMARY"
          issue=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --author 'github-actions[bot]' \
            --search "$title in:title" --json number,title --jq '[.[] | select(.title == "FFF benchmark reference drift")][0].number // empty')
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" -R "$GITHUB_REPOSITORY" --body-file "$report"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file "$report" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
          exit 1
      - name: Upload reference timings
        if: ${{ !cancelled() && steps.timings.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fff-measurements
          path: ${{ runner.temp }}/fff-results/*.bench
          if-no-files-found: error
          retention-days: 30
